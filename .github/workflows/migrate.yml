# Applies new database migrations to production after CI passes on main.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   – the database password you chose for the project
#   SUPABASE_PROJECT_REF   – e.g. aylscqybatccypzabxao
name: Migrate database

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
