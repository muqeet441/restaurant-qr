# Applies new database migrations to production after CI passes on main.
# Skips (with a notice) until the secrets below are configured.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   – the database password you chose for the project
#   SUPABASE_PROJECT_REF   – e.g. aylscqybatccypzabxao
name: Migrate database

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip until secrets are configured
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase secrets not set, skipping migrations. See docs/DEPLOY.md section 6."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        if: steps.cfg.outputs.ready == 'true'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
